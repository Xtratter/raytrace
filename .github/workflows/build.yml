# Build on every push and pull request: Rust host unit tests, Android unit tests and a release APK (unsigned) as an artifact.
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Rust target and host unit tests
        run: |
          rustup target add aarch64-linux-android
          (cd rust && cargo test --lib)
      - name: Unit tests and release build
        env:
          TARGET: aarch64-linux-android
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: raytrace-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0 imagemagick x11-apps
      - name: Tests and release build (x86_64 Linux)
        run: |
          cd rust
          cargo test --lib --features desktop
          cargo build --release --features desktop --bin raytrace-desktop
      - name: Smoke run (software Vulkan, virtual display)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c 'rust/target/release/raytrace-desktop > smoke.log 2>&1 & sleep 14; import -window root screenshot.png; kill %1' || true
          cat smoke.log
          grep -q "adapter:" smoke.log
          ! grep -qi "panicked\|panic:" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: screenshot.png
          if-no-files-found: warn
      - name: Package
        run: |
          v=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          d=raytrace-$v-linux-x86_64
          mkdir "$d"
          cp rust/target/release/raytrace-desktop "$d/raytrace"
          cp LICENSE README.md README.ru.md "$d/"
          cp -r packaging/linux/* "$d/"
          tar czf "$d.tar.gz" "$d"
          echo "TARBALL=$d.tar.gz" >> "$GITHUB_ENV"
      - name: AppImage
        run: |
          v=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          mkdir -p AppDir/usr/bin
          cp rust/target/release/raytrace-desktop AppDir/usr/bin/raytrace
          cp packaging/linux/raytrace.desktop packaging/linux/raytrace.svg AppDir/
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/raytrace" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Raytrace-$v-x86_64.AppImage"
          echo "APPIMAGE=Raytrace-$v-x86_64.AppImage" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: raytrace-linux-${{ github.sha }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.APPIMAGE }}
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$TARBALL" "$APPIMAGE" --clobber
